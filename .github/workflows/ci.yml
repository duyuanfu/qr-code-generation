name: CI

# 触发：推送到 main、任何 PR、以及手动触发
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交会取消上一次未跑完的任务，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 编译打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn package（含单元测试）
        working-directory: backend
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/qr-studio-backend-*.jar
          retention-days: 7

  frontend:
    name: 前端 · 类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: next build
        # rewrites 在构建期写入 routes-manifest，BACKEND_URL 必须是构建期环境变量
        env:
          BACKEND_URL: http://localhost:8080
        run: npm run build

  e2e:
    name: 端到端联调
    runs-on: ubuntu-latest
    needs: backend
    # 真实 MySQL，行为与生产一致；表结构由 schema.sql 在启动时幂等创建
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: qr_studio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/qr_studio?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_root_pw
      # application.yml 只认 DB_PASSWORD，不再有回退值；本地/容器/CI 都必须显式给
      DB_PASSWORD: ci_root_pw
      # 以下三项只在 CI 里生效，与生产无关
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: CiTestPassw0rd
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long-0123456789
      MOCK_PAY_ENABLED: 'true'
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: 启动后端
        working-directory: backend
        run: |
          JAR=$(ls target/qr-studio-backend-*.jar | grep -v original | head -1)
          echo "启动 $JAR"
          nohup java -jar "$JAR" --server.port=8080 > /tmp/backend.log 2>&1 &

      - name: 等待后端就绪
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/payment/config > /dev/null; then
              echo "后端已就绪（${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::后端 120 秒内未就绪"
          tail -n 120 /tmp/backend.log
          exit 1

      - name: 主链路联调
        run: node scripts/e2e-smoke.mjs

      - name: 管理端联调
        run: node scripts/e2e-admin.mjs

      - name: 上传防护联调
        run: node scripts/e2e-upload-guard.mjs

      - name: 失败时输出后端日志
        if: failure()
        run: tail -n 200 /tmp/backend.log || true

  docker:
    name: 镜像构建（手动触发）
    runs-on: ubuntu-latest
    # 默认不跑，避免每次提交都消耗构建分钟数；需要验证 Dockerfile 时手动触发
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: qr-studio-backend:ci

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            BACKEND_URL=http://backend:8080
          tags: qr-studio-frontend:ci
