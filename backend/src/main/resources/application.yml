server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    # 关键：请求体被拒绝（超过上限）时，Tomcat 默认只吞掉 2MB 剩余数据就断连接，
    # 浏览器正在上传的大文件会被 RST，前端只能看到 "Failed to fetch"，拿不到 413。
    # 设为 -1 表示吞完整个请求体，让 413 正常回到浏览器。
    max-swallow-size: -1
    connection-timeout: 60s

spring:
  application:
    name: qr-studio-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qr_studio?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    # 口令只从环境变量读取，不设回退值：缺失时启动直接失败，避免带着默认口令上线。
    # 本地开发的默认值在 application-dev.yml（用 --spring.profiles.active=dev 启用）。
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  servlet:
    multipart:
      # 视频类素材动辄上百 MB，手机直出 4K 片段更大；上限放到 500MB。
      # 必须与 app.upload.max-file-size-mb 保持一致，否则两层限制会互相打架。
      max-file-size: 500MB
      max-request-size: 520MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  jwt:
    # 只从环境变量读取（>=32 字节），无回退值；本地默认值见 application-dev.yml
    secret: ${JWT_SECRET}
    expiration: 604800000 # 7 days
  admin:
    # 首次启动时用于种子化超级管理员，账号已存在则不会覆盖；口令同样只从环境变量读取
    email: ${ADMIN_EMAIL:duyuanfu@yeah.net}
    password: ${ADMIN_PASSWORD}
  paywall:
    # 一键模拟支付通道。只能靠环境变量开启，默认 false —— 漏配的后果是多收款需人工退款，
    # 而不是任何登录用户都能自助免单。
    mock-pay-enabled: ${MOCK_PAY_ENABLED:false}
  upload:
    dir: "data/uploads"
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:500}
    # 上传接口限流（登录后生效）。单账号每分钟 30 次，单 IP 每分钟 60 次兜底。
    rate-limit:
      user-per-minute: ${UPLOAD_RATE_USER_PER_MIN:30}
      ip-per-minute: ${UPLOAD_RATE_IP_PER_MIN:60}
