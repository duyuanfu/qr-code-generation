server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    # 关键：请求体被拒绝（超过上限）时，Tomcat 默认只吞掉 2MB 剩余数据就断连接，
    # 浏览器正在上传的大文件会被 RST，前端只能看到 "Failed to fetch"，拿不到 413。
    # 设为 -1 表示吞完整个请求体，让 413 正常回到浏览器。
    max-swallow-size: -1
    connection-timeout: 60s

spring:
  application:
    name: qr-studio-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qr_studio?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  servlet:
    multipart:
      # 视频类素材动辄上百 MB，手机直出 4K 片段更大；上限放到 500MB。
      # 必须与 app.upload.max-file-size-mb 保持一致，否则两层限制会互相打架。
      max-file-size: 500MB
      max-request-size: 520MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

app:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖，长度至少 32 字节
    secret: ${JWT_SECRET:qr-studio-super-secure-jwt-secret-key-2026-very-long-and-safe-32bytes!}
    expiration: 604800000 # 7 days
  admin:
    # 首次启动时用于种子化超级管理员，账号已存在则不会覆盖
    email: ${ADMIN_EMAIL:duyuanfu@yeah.net}
    password: ${ADMIN_PASSWORD:dyf5970@}
  paywall:
    # 一键模拟支付通道。生产环境必须设为 false，否则任何登录用户都能自助免单
    mock-pay-enabled: ${MOCK_PAY_ENABLED:true}
  upload:
    dir: "data/uploads"
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:500}
    # 上传接口限流（登录后生效）。单账号每分钟 30 次，单 IP 每分钟 60 次兜底。
    rate-limit:
      user-per-minute: ${UPLOAD_RATE_USER_PER_MIN:30}
      ip-per-minute: ${UPLOAD_RATE_IP_PER_MIN:60}
